<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Estoque</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#e9ecef;--panel:#fff;--panel2:#f3f5f9;--line:#e3e8ef;--line2:#cfd7e3;--txt:#1a2233;--mut:#66758d;--acc:#2563eb;--acc2:#1d4ed8;--soft:#eaf1ff;--glass:rgba(255,255,255,.92);--ok:#16a34a;--warn:#d97706;--err:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#1b2029;--panel:#232a36;--panel2:#2b3341;--line:#323b4b;--line2:#44506a;--txt:#e8edf5;--mut:#9aa8bf;--soft:#223455;--glass:rgba(35,42,54,.92)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#1b2029;--panel:#232a36;--panel2:#2b3341;--line:#323b4b;--line2:#44506a;--txt:#e8edf5;--mut:#9aa8bf;--soft:#223455;--glass:rgba(35,42,54,.92)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center}
h1{margin:0;font-size:19px}
.search{flex:1;min-width:0;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:8px 14px}
.ib{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line2);background:var(--panel);border-radius:50%}.ib:hover{background:var(--panel2)}
main{max-width:1000px;margin:0 auto;padding:14px 16px 110px}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}
#alert{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid #d9770655;background:#d9770618;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;animation:rise .35s}
#alert .d{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none;animation:pulse 1.8s infinite}
#alert span{margin-left:auto;color:var(--acc);font-size:12.5px}
@keyframes pulse{50%{box-shadow:0 0 0 6px #d9770622}}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;animation:rise .35s both}
.card.low{border-left-color:var(--warn)}.card.out{border-left-color:var(--err)}
.top{display:flex;gap:12px;align-items:center}
.ph{width:64px;height:64px;flex:none;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph svg{width:28px;height:28px}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{display:block;color:var(--mut);font-size:12.5px}.qrow{display:flex;align-items:center;gap:8px;margin:3px 0}
.stp{display:flex;align-items:center;gap:4px}.stp button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);font-size:18px;line-height:1;padding:0}.stp button:hover{background:var(--soft);color:var(--acc)}
.qin{width:64px;text-align:center;font-size:22px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:10px;padding:2px;-moz-appearance:textfield}.qin::-webkit-inner-spin-button,.qin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.qin:hover{border-color:var(--line2)}.qin:focus{background:var(--panel2);border-color:var(--acc)}.qin.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18);color:var(--acc)}}
.gh{grid-column:1/-1;margin:10px 0 0;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}.gh small{color:var(--mut);font-weight:500}
.hr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.hr b{display:block}.hr span{font-size:12.5px;color:var(--mut)}.hr time{font-size:12px;color:var(--mut);white-space:nowrap}
.hr.in b{color:var(--ok)}.hr.out b{color:var(--err)}
.bdg{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.low .bdg{background:#d9770622;color:var(--warn)}.out .bdg{background:#dc262622;color:var(--err)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.soft{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--soft);color:var(--acc);border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;text-decoration:none}
.soft:hover{filter:brightness(.96)}.soft.grow{flex:1}
.soft.buy{background:var(--acc);color:#fff}.soft.buy:hover{background:var(--acc2);filter:none}
.soft.off{background:var(--panel2);color:var(--mut);opacity:.6;pointer-events:none}
.soft.sq{padding:8px 10px;background:var(--panel2);color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px}
.pill{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;padding:5px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 18px #1a22331a;animation:fade .4s}
.pill button{display:flex;align-items:center;gap:7px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;padding:10px 22px}.pill button:hover{background:var(--acc2)}
.modal{position:fixed;inset:0;z-index:8;background:#0a0f1a99;display:grid;place-items:center;padding:16px;animation:fade .2s}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(460px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px #0006;animation:sheet .25s}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.mhead button{border:0;background:transparent;font-size:22px;line-height:1;color:var(--mut);border-radius:8px;padding:2px 9px}.mhead button:hover{background:var(--panel2)}
.mbody{padding:16px 18px 6px;overflow:auto}
.mfoot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{flex:1;background:var(--acc);color:#fff;border:0;border-radius:11px;padding:11px 14px;font-weight:600}.btn:hover{background:var(--acc2)}
.btn.del{flex:none;background:#dc262618;color:var(--err)}.btn.del.sure{background:var(--err);color:#fff}
.field{margin:0 0 14px}.field label{display:block;color:var(--mut);font-size:12.5px;margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:9px 11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:12px;align-items:center;margin-bottom:14px}.pick .ph{width:84px;height:84px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a2233;color:#fff;padding:9px 16px;border-radius:10px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fbar{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}.fbar .chips{flex:1;min-width:0;margin:0}
.fbar select{flex:none;border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:999px;padding:7px 10px;font-weight:600;max-width:140px}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 6px}
.ar{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ar .ph{width:48px;height:48px}.ar .soft{flex:none}
.soft.pin.on{background:var(--acc);color:#fff}.soft.pin.on svg{fill:currentColor}
.btn.sec{background:var(--panel2);color:var(--txt)}
.catbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.catbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;text-align:left}
.catbtn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.catbtn.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}
.catbar .soft{flex:none;border-radius:999px;padding:8px 14px}
.gh{margin-top:6px}.gb{background:transparent;border:0;font:inherit;font-weight:700;display:flex;gap:6px;align-items:center;padding:6px 0;width:100%;text-align:left}
.gb svg{transition:transform .2s}.gb[aria-expanded=false] svg{transform:rotate(-90deg)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 4px;font-weight:600}
.crow small{color:var(--mut);font-weight:500}.crow.on{color:var(--acc)}.crow:hover{background:var(--panel2)}
.csearch{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:9px 14px;margin-bottom:6px}
.ib{position:relative}.sd{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);background:var(--mut)}
.sd.ok{background:var(--ok)}.sd.sync{background:var(--warn);animation:pulse 1.2s infinite}.sd.err{background:var(--err)}
.hint a{color:var(--acc)}
html.locked body>*:not(#lock){display:none!important}
#lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:20px}
.lbox{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px #0003}
.lbox .lic{width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center}.lbox .lic svg{width:26px;height:26px}
.lbox h2{margin:0;font-size:20px}.lbox input[type=password]{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:12px 14px;font-size:16px;text-align:center}
.lbox label.rem{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.lerr{min-height:18px;color:var(--err);font-size:13px;margin:0}.lbox .lnk{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:4px}
.mfoot{flex-wrap:wrap}.mfoot .btn{min-width:130px}
@media(max-width:480px){.hin{gap:6px;padding:10px}.ib{width:34px;height:34px}h1{font-size:17px}}
</style></head><body>
<header><div class="hin"><h1>Estoque</h1><input id="q" class="search" type="search" placeholder="Buscar produto" aria-label="Buscar produto"><button id="bLock" class="ib" aria-label="Senha do app"></button><button id="bSync" class="ib" aria-label="Sincronização"></button><button id="bHist" class="ib" aria-label="Histórico geral"></button><button id="bTheme" class="ib" aria-label="Alternar tema"></button></div></header>
<main>
<button id="alert" hidden><i class="d"></i><b id="alertTx"></b><span>Ver</span></button>
<div class="fbar"><div id="fs" class="chips"></div><select id="sort" aria-label="Ordenar"><option value="name">A–Z</option><option value="low">Menor estoque</option><option value="mov">Última movimentação</option><option value="new">Mais recentes</option></select></div>
<div id="catbar" class="catbar" hidden><button id="catBtn" class="catbtn"></button><button id="catClr" class="soft sq" aria-label="Limpar categoria" hidden>×</button><button id="colAll" class="soft sq" hidden></button></div>
<div id="list"></div>
</main>
<div class="pill"><button id="bNew"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo produto</button></div>

<div id="mProd" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true">
<div class="mhead"><span id="pTitle">Novo produto</span><button data-close aria-label="Fechar">×</button></div>
<div class="mbody">
<div class="pick"><div class="ph" id="pPh" tabindex="0" role="button" aria-label="Escolher foto"></div>
<div class="row"><button class="soft" id="pPick"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>Foto</button><button class="soft sq" id="pRm" hidden>Remover</button></div>
<input id="pFile" type="file" accept="image/*" hidden></div>
<div class="field"><label for="pName">Nome</label><input id="pName" maxlength="80" autocomplete="off"></div>
<div class="two"><div class="field"><label for="pQty">Quantidade</label><input id="pQty" type="number" min="0" inputmode="numeric" value="0"></div>
<div class="field"><label for="pMin">Avisar quando chegar em</label><input id="pMin" type="number" min="0" inputmode="numeric" value="5"></div></div>
<div class="two"><div class="field"><label for="pCat">Categoria</label><input id="pCat" list="dl" maxlength="40" placeholder="Ex.: Canecas" autocomplete="off"><datalist id="dl"></datalist></div><div class="field"><label for="pSku">SKU (opcional)</label><input id="pSku" maxlength="30" autocomplete="off"></div></div>
<div class="field"><label for="pUrl">Link de compra do fornecedor</label><input id="pUrl" inputmode="url" placeholder="https://" autocomplete="off"></div>
</div>
<div class="mfoot"><button class="btn del" id="pDel" hidden>Excluir</button><button class="btn" id="pSave">Salvar produto</button></div>
</div></div>

<div id="mHist" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><span id="hTitle">Histórico</span><button data-close aria-label="Fechar">×</button></div><div class="mbody" id="hBody"></div></div></div>
<div id="mAlert" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><span>Estoque baixo: hora de comprar</span><button data-close aria-label="Fechar">×</button></div><div class="mbody" id="aBody"></div><div class="mfoot"><button class="btn sec" data-close>Fechar</button><button class="btn" id="aGo">Ver na lista</button></div></div></div>
<div id="mCat" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><span>Categorias</span><button data-close aria-label="Fechar">×</button></div><div class="mbody"><input id="cSearch" class="csearch" type="search" placeholder="Buscar categoria" aria-label="Buscar categoria" autocomplete="off"><div id="cList"></div></div></div></div>
<div id="mSync" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><span>Sincronização na nuvem</span><button data-close aria-label="Fechar">×</button></div><div class="mbody">
<p class="hint" id="sStat"></p>
<div class="field"><label for="sUrl">URL do Firebase Realtime Database</label><input id="sUrl" inputmode="url" placeholder="https://seu-projeto-default-rtdb.firebaseio.com" autocomplete="off"></div>
<div class="field"><label for="sCode">Código secreto (o mesmo em todos os aparelhos)</label><input id="sCode" maxlength="40" autocomplete="off" autocapitalize="off"><div class="row" style="margin-top:6px"><button class="soft" id="sGen" type="button">Gerar código</button></div></div>
<p class="hint">Quem tiver o código acessa seus dados: não compartilhe. Para conectar o celular, use “Copiar link de conexão” e abra no aparelho.</p>
<div class="row" style="margin-bottom:12px"><button class="soft" id="sLink" type="button">Copiar link de conexão</button><button class="soft" id="sExp" type="button">Baixar backup</button><button class="soft" id="sImp" type="button">Restaurar backup</button><input id="sFile" type="file" accept="application/json,.json" hidden></div>
</div><div class="mfoot"><button class="btn del" id="sOff" hidden>Desconectar</button><button class="btn" id="sSave">Salvar e sincronizar</button></div></div></div>
<div id="lock" hidden><form id="lockF" class="lbox" autocomplete="on">
<div class="lic"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
<h2>Estoque</h2><div class="mut">Digite a senha para entrar</div>
<input id="lPw" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
<label class="rem"><input id="lRem" type="checkbox"> Lembrar neste aparelho por 7 dias</label>
<p class="lerr" id="lErr" role="alert"></p>
<button class="btn" id="lGo" type="submit" style="flex:none">Entrar</button>
<button class="lnk" id="lForgot" type="button">Esqueci a senha</button>
</form></div>
<div id="mPass" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><span id="wTitle">Senha do app</span><button data-close aria-label="Fechar">×</button></div><div class="mbody">
<p class="hint" id="wInfo"></p>
<div class="field" id="wCur" hidden><label for="wOld">Senha atual</label><input id="wOld" type="password" autocomplete="current-password"></div>
<div class="field"><label for="wP1" id="wL1">Nova senha (mínimo 6 caracteres)</label><input id="wP1" type="password" autocomplete="new-password"></div>
<div class="field"><label for="wP2">Repita a nova senha</label><input id="wP2" type="password" autocomplete="new-password"></div>
</div><div class="mfoot"><button class="btn del" id="wRm" hidden>Remover senha</button><button class="btn sec" id="wNow" hidden>Bloquear agora</button><button class="btn" id="wSave">Salvar senha</button></div></div></div>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id),KEY='estoque.v1',HK='estoque.hist.v1';
let items=[],hist=[],sort='name',filter='all',cat='',term='',editId=null,photo=null,flash=null,sure=false;
try{items=JSON.parse(localStorage.getItem(KEY)||'[]');hist=JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){}
const SK='estoque.sync.v1',DK='estoque.del.v1',CK='estoque.col',DIRTY='estoque.dirty';
let cfg={url:'',code:''},del={},seenV=0,busy=false,again=false,dirty=false,syncT,lastErr='',col=new Set(),lastTitles=[];
try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(SK)||'{}'));del=JSON.parse(localStorage.getItem(DK)||'{}');col=new Set(JSON.parse(localStorage.getItem(CK)||'[]'));dirty=localStorage.getItem(DIRTY)=='1'}catch(e){}
items.forEach(p=>{if(!p.u)p.u=p.id||1});
const synced=()=>!!(cfg.url&&cfg.code);
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(HK,JSON.stringify(hist));localStorage.setItem(DK,JSON.stringify(del));return true}catch(e){toast('Sem espaço para salvar. Use fotos menores ou exclua itens.');return false}}
function sv(){if(!saveLocal())return false;queueSync();return true}
function setDirty(v){dirty=v;try{localStorage.setItem(DIRTY,v?'1':'0')}catch(e){}}
function queueSync(){if(!synced())return;setDirty(true);clearTimeout(syncT);syncT=setTimeout(()=>sync(),700)}
const vals=x=>Array.isArray(x)?x.filter(Boolean):Object.values(x||{});
const hkey=h=>h.t+'_'+h.pid+'_'+h.type;
const isig=a=>a.map(p=>p.id+':'+(p.u||0)).sort().join();
function merge(r){
 const D={};[r.del||{},del].forEach(o=>Object.keys(o).forEach(k=>{D[k]=Math.max(D[k]||0,o[k])}));
 const lim=Date.now()-90*864e5;Object.keys(D).forEach(k=>{if(D[k]<lim)delete D[k]});
 const map={};items.forEach(p=>map[p.id]=p);
 vals(r.items).forEach(p=>{const l=map[p.id];if(!l||(p.u||0)>(l.u||0))map[p.id]=p});
 const out=Object.values(map).filter(p=>!(D[p.id]&&D[p.id]>=(p.u||0)));
 const hm={};[...vals(r.hist),...hist].forEach(h=>hm[hkey(h)]=h);
 return{items:out,hist:Object.values(hm).sort((a,b)=>b.t-a.t).slice(0,500),del:D}}
const ST={off:'Não conectado: os dados ficam só neste aparelho.',sync:'Sincronizando…',ok:'Sincronizado',err:'Sem conexão com a nuvem. Seus dados estão salvos aqui e serão enviados depois.'};
let stt='off',lastOk=0;
function setSt(x){stt=x;if(x=='ok')lastOk=Date.now();const d=$('sDot');if(d){d.className='sd '+x;d.hidden=x=='off'}

/* produto */
function openProd(id){editId=id||null;sure=false;const p=items.find(x=>x.id==id)||{name:'',qty:0,min:5,url:'',img:null,cat:cat&&cat!='-'?cat:''};
 $('pTitle').textContent=id?'Editar produto':'Novo produto';$('pName').value=p.name;$('pQty').value=p.qty;$('pMin').value=p.min;$('pUrl').value=p.url||'';$('pCat').value=p.cat||'';$('pSku').value=p.sku||'';photo=p.img||null;setPh();
 $('dl').innerHTML=[...new Set(items.map(x=>x.cat).filter(Boolean))].map(c=>'<option value="'+esc(c)+'">').join('');
 $('pDel').hidden=!id;$('pDel').textContent='Excluir';$('pDel').classList.remove('sure');open('mProd');$('pName').focus()}
$('bNew').onclick=()=>openProd();
$('pSave').onclick=()=>{const name=$('pName').value.trim();if(!name){toast('Digite o nome do produto.');return $('pName').focus()}
 const url=cleanUrl($('pUrl').value);if(url===null){toast('O link de compra não parece válido.');return $('pUrl').focus()}
 const qty=Math.max(0,parseInt($('pQty').value)||0),min=Math.max(0,parseInt($('pMin').value)||0);const sku=$('pSku').value.trim().slice(0,30);let c=$('pCat').value.trim().replace(/\s+/g,' ');
 const same=items.find(x=>x.cat&&x.cat.toLowerCase()==c.toLowerCase());if(same)c=same.cat;
 if(editId){const p=items.find(x=>x.id==editId),ch=[];
  if(p.name!=name)ch.push('nome');if(p.min!=min)ch.push('mínimo');if((p.cat||'')!=c)ch.push('categoria');if((p.url||'')!=url)ch.push('link');if((p.sku||'')!=sku)ch.push('SKU');if((p.img||null)!==photo)ch.push('foto');
  const old=p.qty;Object.assign(p,{name,qty,min,url,sku,cat:c,img:photo,u:Date.now()});
  if(ch.length)log(p,'edit',0,0,0,'Alterou: '+ch.join(', '));if(qty!=old)log(p,qty>old?'in':'out',qty-old,old,qty);flash=p.id}
 else{const p={id:Date.now(),name,qty,min,url,sku,cat:c,img:photo,u:Date.now()};items.push(p);log(p,'new',0,0,qty);flash=p.id}
 if(!sv())return;close();render();toast('Produto salvo.')};
$('pDel').onclick=()=>{if(!sure){sure=true;$('pDel').textContent='Confirmar exclusão';$('pDel').classList.add('sure');return}
 const p=items.find(x=>x.id==editId);log(p,'del',0,p.qty,0);del[p.id]=Date.now();items=items.filter(x=>x.id!=editId);sv();close();render();toast('Produto excluído.')};
/* filtros */
$('q').oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
$('fs').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}};$('sort').onchange=e=>{sort=e.target.value;render()};$('alert').onclick=()=>{filter='low';render()};
function drawCat(){const q=$('cSearch').value.trim().toLowerCase(),m={};items.forEach(p=>{const c=p.cat||'-';m[c]=(m[c]||0)+1});
 const names=Object.keys(m).filter(c=>c!='-').sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const rows=[['','Todas as categorias',items.length],...names.map(c=>[c,c,m[c]]),...(m['-']?[['-','Sem categoria',m['-']]]:[])].filter(r=>!q||(r[0]!==''&&r[1].toLowerCase().includes(q)));
 $('cList').innerHTML=rows.map(r=>'<button class="crow'+(r[0]==cat?' on':'')+'" data-c="'+esc(r[0])+'"><span>'+esc(r[1])+'</span><small>'+r[2]+'</small></button>').join('')||'<div class="empty">Nenhuma categoria encontrada.</div>'}
$('catBtn').onclick=()=>{$('cSearch').value='';drawCat();open('mCat')};
$('cSearch').oninput=drawCat;
$('cList').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;close();render()}};
$('catClr').onclick=()=>{cat='';render()};
$('colAll').onclick=()=>{col.size?col.clear():lastTitles.forEach(t=>col.add(t));try{localStorage.setItem(CK,JSON.stringify([...col]))}catch(x){}render()};
/* tema */
const mq=matchMedia('(prefers-color-scheme:dark)'),root=document.documentElement;
const dark=()=>root.dataset.theme?root.dataset.theme=='dark':mq.matches;
function themeIcon(){$('bTheme').innerHTML=dark()?IC('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'):IC('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>')}
try{const s=localStorage.getItem('estoque.tema');if(s)root.dataset.theme=s}catch(e){}
$('bTheme').onclick=()=>{const n=dark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('estoque.tema',n)}catch(e){}themeIcon()};
$('bHist').innerHTML=IC('<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>');
$('bSync').innerHTML=IC('<path d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>')+'<i id="sDot" class="sd" hidden></i>';
mq.addEventListener('change',themeIcon);themeIcon();render();drawLockIcon();initLock();initSync();
</script></body></html>
